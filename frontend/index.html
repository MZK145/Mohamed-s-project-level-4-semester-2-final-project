<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metro System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login / Signup -->
  <form id="loginForm">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Login</button>
    <p>Don't have an account? <a href="#" id="showSignup">Sign up</a></p>
  </form>

  <form id="signupForm" style="display:none;">
    <h2>Sign Up</h2>
    <input type="text" id="name" placeholder="Full Name" required />
    <input type="email" id="signupEmail" placeholder="Email" required />
    <input type="password" id="signupPassword" placeholder="Password" required />
    <button type="submit">Create Account</button>
    <p>Already have an account? <a href="#" id="showLogin">Login</a></p>
  </form>

  <div id="loginResult"></div>

  <!-- Main Metro Section -->
  <div id="metroSection" style="display:none;">
    <h1>🚇 Metro</h1>

    <!-- Origin selection -->
    <div id="originPanel">
      <h3>Select your origin station</h3>
      <label for="governorate">Governorate:</label>
      <select id="governorate" class="styled-dropdown">
        <option value="">-- Select Governorate --</option>
      </select>

      <label for="city">City / District:</label>
      <select id="city" class="styled-dropdown" disabled>
        <option value="">-- Select City --</option>
      </select>

      <label for="stations">Station:</label>
      <select id="stations" class="styled-dropdown" disabled>
        <option value="">-- Select Station --</option>
      </select>

      <button id="nextToDestination" class="submit-btn">Next →</button>
      <div id="originError" class="error-msg" style="display:none;">Please select a station.</div>
    </div>

    <!-- Destination selection -->
    <div id="destinationPanel" style="display:none;">
      <h3>Select your destination</h3>
      <label for="destinationStations">Destination Station:</label>
      <select id="destinationStations" class="styled-dropdown">
        <option value="">-- Select Destination --</option>
      </select>
      <div style="margin-top:20px;">
        <button id="confirmDestination" class="submit-btn">Next →</button>
        <button id="backToOrigin" class="back-btn" style="margin-left:10px;">← Back</button>
      </div>
      <div id="destinationError" class="error-msg" style="display:none;">Please select a destination.</div>
    </div>

    <!-- Train selection -->
    <div id="trainSelectionPanel" style="display:none;">
      <h3>Select a train</h3>
      <label for="trainSelect">Available Trains:</label>
      <select id="trainSelect" class="styled-dropdown">
        <option value="">-- Choose a train --</option>
      </select>
      <div style="margin-top:20px;">
        <button id="confirmTrain" class="submit-btn">Confirm Train</button>
        <button id="backToDestination" class="back-btn" style="margin-left:10px;">← Back</button>
      </div>
      <div id="trainError" class="error-msg" style="display:none;">Please select a train.</div>
    </div>

    <!-- Waiting room -->
    <div id="waitingRoom" style="display:none;">
      <h2>🚉 Waiting Room</h2>
      <div id="journeyInfo"></div>
      <div id="waitingStatus"></div>
      <div id="countdown"></div>
      <button id="backToOriginFromWaiting" class="back-btn">← Start Over</button>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" style="display:none; margin-top:30px; border-top:1px solid #334155; padding-top:20px;">
      <h3>🛠️ Admin Controls</h3>
      <button id="showAddStationForm" class="submit-btn" style="background:#8b5cf6;">Add Station</button>
      <button id="showManageStations" class="submit-btn" style="background:#f59e0b; margin-left:10px;">Manage Stations</button>
      <div id="adminContent" style="margin-top:20px;"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
